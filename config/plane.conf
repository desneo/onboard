# plane 运行配置

[system]
# 默认飞行安全高度（米）
safe_height_m = 30.0
# 日志目录
log_dir = logs
# 状态上报周期（毫秒）
state_report_period_ms = 1000

[communication]
# 通信配置
plane_id = uav1
station_id = gcs
zenoh_config_file =
# 远端 zenoh 端点（多个用逗号分隔），如 tcp/192.168.1.41:7447；留空=默认/组播发现
zenoh_connect = tcp/192.168.1.41:7447
zenoh_listen =
# Zenoh 调试日志：打印每条消息发送的目标端点（默认关闭）
debug_log = false
ack_timeout_ms = 500
ack_max_retries = 3
rx_queue_max = 1024

# 地面站链路判定（2 秒未收到 GCS 报文判定断开）
gcs_link_timeout_ms = 2000

[flight_control]
# 飞控连接（udp 或 serial）
link_type = udp
udp_url = udpout://192.168.1.56:14281
serial_device = /dev/ttyUSB0
serial_baud = 57600
heartbeat_timeout_ms = 5000
route_speed_m_s = 5.0

[behavior_tree]
# 行为树执行参数
tick_interval_ms = 50
node_timeout_ms = 30000
takeoff_tolerance_m = 1.0

[plugins]
# 插件目录
directory = build/plugins

[image_input]
# 取图插件
# 图像源类型：Mipi | Rtsp
type = Mipi
# MIPI 设备路径；留空=自动发现（未找到或多个时报错）
mipi_device =
# Rtsp 类型的拉流地址
rtsp_url = rtsp://192.168.1.220:8554/drone
# 断流/不可达重试间隔（秒）
reconnect_interval_s = 10
# 读流尺寸（MIPI 采集分辨率），传给取图插件；建议与 detection.input_* 一致以避免二次缩放
width = 640
height = 640

[detection]
# 检测插件（det_mot）
# 模型文件或目录地址（相对运行目录 build/plane，构建时由 bundle_plane.sh 复制 models）
model_path = models/yolo11/yolo11n
# 检测/MOT/输出/调试参数目录（须含 det_mot.json）
config_dir = /home/firefly/code/projects/anti-uav/algorithm/perception/configs
confidence_threshold = 0.4
nms_threshold = 0.45
track_thresh = 0.5
track_buffer = 30
# 检测模型输入分辨率：读流后先将帧 resize 到该尺寸，再进行检测与推流
input_width = 640
input_height = 640

[video_output]
# 推流插件（videostream_output）
# 推流协议：WebRtc | Rtsp
type = Rtsp
# 期望推流地址（可空，由 app/stream 与端口生成）
url =
app = live
stream = stream
rtsp_port = 8554
http_port = 8080
rtc_port = 8000
# 输出流分辨率：与检测输入（detection.input_width/height）保持一致
width = 640
height = 640
max_fps = 30
bitrate_kbps = 4096
gop = 30

[debug]
# 目标调试日志：逐帧打印目标更新等高频日志（默认关闭，排查时置 true）
target_log = false

[safety]
# 安全告警（低电压阈值，按实机电池配置）
alert_voltage_threshold_v = 21.0

[suicide_mission]
# 自杀式反无任务（阶段阈值与失败判定，联调时按实际调整）
detection_start_distance_m = 200.0
approach_speed_m_s = 10.0
track_approach_speed_m_s = 5.0
climb_speed_m_s = 2.0
target_select_rule = nearest_center
guidance_start_stable_ms = 500
track_lost_timeout_ms = 3000
phase_timeout_ms = 300000
impact_height_m = 2.0
impact_vd_m_s = 3.0
