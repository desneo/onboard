# plane 运行配置

[system]
# 默认飞行安全高度（米）
safe_height_m = 30.0
# 日志目录
log_dir = logs
# 状态上报周期（毫秒）
state_report_period_ms = 1000

[communication]
# 通信配置
plane_id = uav1
station_id = GCS
zenoh_config_file =
# 远端 zenoh 端点（多个用逗号分隔），如 tcp/192.168.1.41:7447；留空=默认/组播发现
zenoh_connect = tcp/192.168.1.41:7447
zenoh_listen =
# Zenoh 调试日志：打印每条消息发送的目标端点（默认关闭）
debug_log = false
ack_timeout_ms = 500
ack_max_retries = 3
rx_queue_max = 1024

# 地面站链路判定（2 秒未收到 GCS 报文判定断开）
gcs_link_timeout_ms = 2000

[flight_control]
# 飞控连接（udp 或 serial）
link_type = udp
udp_url = udpout://192.168.1.40:14580
serial_device = /dev/ttyUSB0
serial_baud = 57600
heartbeat_timeout_ms = 5000
route_speed_m_s = 5.0

[behavior_tree]
# 行为树执行参数
tick_interval_ms = 50
node_timeout_ms = 30000
takeoff_tolerance_m = 1.0
# 航线开始前调整相对高度的超时和到达容差
height_adjust_timeout_ms = 120000
height_adjust_tolerance_m = 1.0

[safety]
# 安全告警（低电压阈值，按实机电池配置）
alert_voltage_threshold_v = 21.0

[suicide_mission]
# 自杀式反无任务（阶段阈值与失败判定，联调时按实际调整）
detection_start_distance_m = 200.0
approach_speed_m_s = 10.0
climb_speed_m_s = 2.0
phase_timeout_ms = 300000
