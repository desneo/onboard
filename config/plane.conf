# plane 运行配置

[system]
# 默认飞行安全高度（米）
safe_height_m = 30.0
# 日志目录
log_dir = logs
# 任务板 IP，仅用于 VehicleInfo 上报；部署时按板卡配置
board_ip =
# 状态上报周期（毫秒）
state_report_period_ms = 100

[communication]
# 通信配置
plane_id = uav1
station_id = GCS
# Zenoh 原生配置，单次主动建链超时为 2000 毫秒
zenoh_config_file = config/zenoh.json5
# 远端 Zenoh 端点（多个用逗号分隔）；留空使用自动发现
zenoh_connect =
zenoh_listen =
# Zenoh 调试日志：打印每条消息发送的目标端点（默认关闭）
debug_log = false
ack_timeout_ms = 500
ack_max_retries = 3
rx_queue_max = 1024

# 地面站链路判定（2 秒未收到 GCS 报文判定断开）
gcs_link_timeout_ms = 2000

[camera]
# 吊舱视频流地址，仅传递元数据，不进行视频处理
pod_video_url =

[flight_control]
# 飞控连接（udp 或 serial）
link_type = udp
udp_url = udpout://192.168.1.56:14580
serial_device = /dev/ttyUSB0
serial_baud = 57600
heartbeat_timeout_ms = 5000
route_speed_m_s = 5.0

[behavior_tree]
# 行为树执行参数
tick_interval_ms = 50
node_timeout_ms = 30000
takeoff_tolerance_m = 1.0
# 航线开始前调整相对高度的超时和到达容差
height_adjust_timeout_ms = 120000
height_adjust_tolerance_m = 1.0

[safety]
# 安全告警（低电压阈值，按实机电池配置）
alert_voltage_threshold_v = 21.0

[midcourse]
# 中制导等待 20 帧雷达历史的超时（毫秒）
init_timeout_ms = 30000
# 算法允许目标估计预测维持的最大龄期（秒）
target_invalid_grace_s = 3.0
# 中制导接近目标时的距离保护（米），与 GCS 友机匹配门限无关
r_min_m = 50.0
