# 多机测试环境清单。
#
# 该文件是自动化工具的机器可读输入；新增板卡时按 plane.<plane_id> 增加 section。
# 内部测试环境允许保存密码，但 fleetctl 不会在日志或报告中输出密码。

[fleet]
runtime_dir = /home/firefly/plane
state_samples = 3
startup_timeout_s = 60
verify_timeout_s = 45
board_arch = aarch64
board_os_version = 22.04
apt_proxy = http://192.168.1.56:7890
apt_bootstrap_packages = libopencv-dev
apt_packages = librga2
    libavformat58 libavcodec58 libavutil56 libswscale5
    librockchip-mpp1 libsrtp2-1

[simulator]
host = 192.168.1.56
user = aeroarx
password = 1
scenario_dir = /home/aeroarx/zsh/PX4-Autopilot/scenarios/02_rocket_two_axis_pod
start_command = ./start.sh
stop_command = ./stop.sh

[plane.uav1]
host = 192.168.1.100
user = firefly
password = firefly

[plane.uav2]
host = 192.168.1.101
user = firefly
password = firefly
