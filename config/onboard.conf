# 机载程序运行配置（第一版）
# 默认飞行安全高度（米）
safe_height_m = 30.0
# 日志目录
log_dir = logs
# 状态上报周期（毫秒）
state_report_period_ms = 1000

# 通信配置
plane_id = uav1
station_id = gcs
zenoh_config_file =
zenoh_connect =
zenoh_listen =
comm_ack_timeout_ms = 500
comm_ack_max_retries = 3
comm_rx_queue_max = 1024

# 地面站链路判定（2 秒未收到 GCS 报文判定断开）
gcs_link_timeout_ms = 2000

# 飞控连接（udp 或 serial）
fc_link_type = udp
fc_udp_url = udpout://192.168.1.56:14281
fc_serial_device = /dev/ttyUSB0
fc_serial_baud = 57600
fc_heartbeat_timeout_ms = 2000
fc_route_speed_m_s = 5.0

# 行为树执行参数
bt_tick_interval_ms = 50
bt_node_timeout_ms = 30000
bt_takeoff_tolerance_m = 1.0

# ===== 插件目录 =====
plugins_dir = build/plugins

# ===== 取图插件（image_input） =====
# 图像源类型：Mipi | Rtsp
image_source_type = Mipi
# MIPI 设备路径；留空=自动发现（未找到或多个时报错）
image_mipi_device =
# Rtsp 类型的拉流地址
image_rtsp_url = rtsp://192.168.1.220:8554/drone
# 断流/不可达重试间隔（秒）
image_reconnect_interval_s = 10

# ===== 检测插件（det_mot） =====
# 模型文件或目录地址（相对运行目录 build/plane，构建时由 bundle_plane.sh 复制 models）
det_model_path = models/yolo11/yolo11n
# 检测/MOT/输出/调试参数目录（须含 det_mot.json）
det_config_dir = /home/firefly/code/projects/anti-uav/algorithm/perception/configs
det_confidence_threshold = 0.4
det_nms_threshold = 0.45
det_track_thresh = 0.5
det_track_buffer = 30

# ===== 推流插件（videostream_output） =====
# 推流协议：WebRtc | Rtsp
stream_type = Rtsp
# 期望推流地址（可空，由 app/stream 与端口生成）
stream_url =
stream_app = live
stream_name = stream
stream_rtsp_port = 8554
stream_http_port = 8080
stream_rtc_port = 8000
stream_width = 1280
stream_height = 720
stream_max_fps = 30
stream_bitrate_kbps = 4096
stream_gop = 30

# 目标调试日志：逐帧打印目标更新等高频日志（默认关闭，排查时置 true）
debug_target_log = false

# 安全告警（低电压阈值，按实机电池配置）
alert_voltage_threshold_v = 21.0

# 自杀式反无任务（阶段阈值与失败判定，联调时按实际调整）
suicide_detection_start_distance_m = 200.0
suicide_approach_speed_m_s = 10.0
suicide_track_approach_speed_m_s = 5.0
suicide_climb_speed_m_s = 2.0
suicide_target_select_rule = nearest_center
suicide_guidance_start_stable_ms = 500
suicide_track_lost_timeout_ms = 3000
suicide_phase_timeout_ms = 300000
suicide_impact_height_m = 2.0
suicide_impact_vd_m_s = 3.0
