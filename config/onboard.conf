# 机载程序运行配置（第一版）
# 默认飞行安全高度（米）
safe_height_m = 30.0
# 日志目录
log_dir = logs
# 状态上报周期（毫秒）
state_report_period_ms = 1000

# 通信配置
plane_id = uav1
station_id = gcs
zenoh_config_file =
zenoh_connect =
zenoh_listen =
comm_ack_timeout_ms = 500
comm_ack_max_retries = 3
comm_rx_queue_max = 1024

# 地面站链路判定（2 秒未收到 GCS 报文判定断开）
gcs_link_timeout_ms = 2000

# 飞控连接（udp 或 serial）
fc_link_type = udp
fc_udp_url = udp://:14540
fc_serial_device = /dev/ttyUSB0
fc_serial_baud = 57600
fc_heartbeat_timeout_ms = 2000
fc_route_speed_m_s = 5.0

# 行为树执行参数
bt_tick_interval_ms = 50
bt_node_timeout_ms = 30000
bt_takeoff_tolerance_m = 1.0

# 感知与插件
plugins_dir = build/plugins
image_source =
image_reconnect_interval_ms = 2000
perception_process_interval_ms = 100
perception_selftest_on_start = false
