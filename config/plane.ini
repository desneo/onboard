# plane 运行配置

[deployment]
# 同一集群的板卡使用同一份预置，按本机 IPv4 地址识别飞机 ID。
# 必须指定预置；相对路径以运行目录为基准。
profile = config/profiles/sitl_jielian_a2416a.ini

# 仿真预置的 pod_model 与 Gazebo 资产目录对应关系：
# jielian_a2416a  对应 jielian-A2416A
# two_axis        对应 two_axis_pod
# three_axis      对应 three_axis_pod
# aisheng_asd2    对应 aisheng-ASD-2-075-DD0
# zhongke_d80     对应 zhongke-d80

[system]
# 默认飞行安全高度（米）
safe_height_m = 20.0
# 日志目录
log_dir = logs
# 状态上报周期（毫秒）
state_report_period_ms = 100

[communication]
# Zenoh 原生配置，单次主动建链超时为 2000 毫秒
zenoh_config_file = config/zenoh.json5
# Zenoh 调试日志：打印每条消息发送的目标端点（默认关闭）
debug_log = false
ack_timeout_ms = 500
ack_max_retries = 3
rx_queue_max = 1024

# 地面站链路判定（2 秒未收到 GCS 报文判定断开）
gcs_link_timeout_ms = 2000

[camera]
# PodState 上报频率，单位 Hz
pod_state_report_hz = 5

[flight_control]
# MAVSDK 心跳超时（毫秒）；连接地址由预置的 fc_url 提供。
heartbeat_timeout_ms = 5000
route_speed_m_s = 5.0

[behavior_tree]
# 行为树执行参数
tick_interval_ms = 50
node_timeout_ms = 30000
takeoff_tolerance_m = 1.0
# 航线开始前调整相对高度的超时和到达容差
height_adjust_timeout_ms = 120000
height_adjust_tolerance_m = 1.0

[safety]
# 安全告警（低电压阈值，按实机电池配置）
alert_voltage_threshold_v = 21.0

[midcourse]
# 中制导等待 20 帧雷达历史的超时（毫秒）
init_timeout_ms = 30000

[midcourse_algorithm]
# false 使用下列四项限值；true 使用 PX4 缓存中的 MPC_XY_VEL_MAX、
# MPC_Z_VEL_MAX_UP、MPC_Z_VEL_MAX_DN、MPC_ACC_HOR_MAX。
use_px4_limits = false
# 水平速度限幅（合成模长，m/s），必须 > 0。
max_horizontal_speed_m_s = 60.0
# 垂直上升速度限幅（m/s），必须 > 0。
max_climb_speed_m_s = 20.0
# 垂直下降速度限幅（m/s），必须 > 0。
max_descent_speed_m_s = 20.0
# 指令加速度上限（m/s²），0 表示关闭限幅。
cmd_accel_max_m_s2 = 20.0

# 平台标定：质量和最大总拉力必须为有限正数，更换平台时须按实际标定值配置。
# 平台质量（kg），悬停推力为 vehicle_mass_kg × g0。
vehicle_mass_kg = 5.0
# 最大总拉力（N），用于动力学模型，并作为姿态档推力归一化的分母。
max_thrust_n = 269.0

# 基础制导参数
# 逼近段巡航速度（m/s），作为速度闭环的目标速度。
v_cruise_m_s = 55.0
# 逼近段到点减速增益（1/s）；指令速度限制为 min(v_cruise_m_s, approach_brake_k × 距追踪点)，
# 防止满速冲过追踪点后反弹；远距时限制在巡航速度。
approach_brake_k = 0.5
# 视线角速率前馈增益（秒）。
tau_ff_s = 1.0
# 距离保护（米）。
r_min_m = 50.0
# 规划器固定调用周期（秒），须等于 [behavior_tree] 的 tick_interval_ms / 1000。
# 算法内部时钟按此周期积分，不按目标量测时间戳差分计算。
update_dt_s = 0.05
# 有效目标估计可通过预测维持的最大龄期（秒）。
target_invalid_grace_s = 3.0
# 控制输出：VelocityAcceleration 为速度与加速度前馈，Attitude 为姿态与推力。
control_output_mode = VelocityAcceleration
# 悬停刹车减速度（m/s²），仅速度档生效；触发悬停时速度指令沿原航向线性降至零，
# 避免速度环全量刹车导致电机饱和。
hover_brake_accel_m_s2 = 5.0
# 速度档期望航向：0 不约束（保持当前航向），1 对齐速度指令方向，由 PX4 偏航内环执行。
yaw_mode = 1
# 期望航向变化率上限（度/秒），yaw_mode = 1 时生效。
yaw_rate_max_deg_s = 45.0

# 捕获窗与交班几何
# 导引头半视场角（度），用于捕获锥判定。
half_fov_deg = 15.0
# 捕获窗最近距离（米）。
r_capture_min_m = 50.0
# 捕获窗最远距离（米），须大于 r_capture_min_m。
r_capture_max_m = 500.0
# 名义交班距离（米）。
r_capture_nominal_m = 100.0
# 捕获窗回缩系数，用于防止边界抖动。
capture_discount = 0.7
# 交班时刻视线角速率上限（度/秒）。
sigma_dot_max_deg_s = 5.0
# 交班速度比 v_h / |v_t|。
speed_ratio = 1.05
# 交班点位置容差（米）。
tol_pos_m = 150.0
# 交班点速度容差（m/s，字段名沿用 tol_vel_m）。
tol_vel_m = 20.0
# 交班点加速度容差（m/s²）。
tol_accel_m_s2 = 5.0
# 航迹与交班点最低离地高度（米），0 表示不校验。
min_altitude_m = 10.0

# 规划选档
# true 评估全部候选并选择代价最优者；false 遇到可行候选即停止搜索。
use_cost_search = true
# 交班时长的代价权重。
w_time = 1.0
# 速度峰值的代价权重。
w_speed = 1.0
# 加速度峰值的代价权重。
w_accel = 1.0

# 重规划
# 重规划近端冻结时长（秒），用于保持指令连续。
replan_stitch_s = 2.5

# 轨迹跟踪
# 位置反馈增益（1/s）。
track_gain_k = 0.5
# 速度误差反馈增益，0 表示仅使用位置反馈。
track_gain_d = 0.0
# 位置反馈修正限幅（m/s）。
track_max_corr = 10.0

# 初始高度恢复
# 高度误差到爬升速度的增益。
recovery_gain_k = 1.0
# 恢复目标余量（米），用于防止边界抖动。
recovery_margin_m = 2.0
# 退出高度恢复前，恢复条件需连续满足的时长（秒）。
recovery_exit_hold_s = 0.5

# 跟随段
# 位置修正增益（1/s）。
follow_gain_k = 0.05
# 锚点误差低通系数。
follow_filter_a = 0.3
# 目标速度低通时间常数（秒）。
follow_vel_tau_s = 1.0

# 末端接管确认来源：true 由算法内部按物理条件自主确认；
# false 由末端制导或任务层显式调用 notifyHandoverConfirmed() 确认。
enable_internal_terminal_confirmation = false
# 以下三项仅在 enable_internal_terminal_confirmation = true 时生效。
# 目标离视轴角上限（度）。
confirm_boresight_deg = 5.0
# 弹轴角速率上限（度/秒）。
confirm_rate_deg_s = 5.0
# 离视轴角和弹轴角速率条件需同时满足的持续时长（秒）。
confirm_hold_s = 2.0
