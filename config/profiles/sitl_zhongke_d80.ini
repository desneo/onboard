# SITL 中科 D80机群部署预置
# pod_model 对应 Gazebo 资产目录 zhongke-d80。
# 节名为飞机 ID；启动时按板卡的本机 IPv4 地址匹配 board_ip。
# fc_url 接受 MAVSDK 的 UDP 或串口地址，例如 serial:///dev/ttyS0:57600。

[groundstation]
# 地面站 Zenoh TCP 监听所在的 IPv4 地址；留空只生成机间连接。
ip = 192.168.1.41

[uav1]
board_ip = 192.168.1.100
fc_url = udpout://192.168.1.56:14280
pod_model = zhongke_d80
pod_video_url = rtsp://192.168.1.56:8566/zhongke_d80_1
pod_control_url = udp://192.168.1.56:8880

[uav2]
board_ip = 192.168.1.101
fc_url = udpout://192.168.1.56:14281
pod_model = zhongke_d80
pod_video_url = rtsp://192.168.1.56:8567/zhongke_d80_2
pod_control_url = udp://192.168.1.56:8881

[uav3]
board_ip = 192.168.1.102
fc_url = udpout://192.168.1.56:14282
pod_model = zhongke_d80
pod_video_url = rtsp://192.168.1.56:8568/zhongke_d80_3
pod_control_url = udp://192.168.1.56:8882

[uav4]
board_ip = 192.168.1.103
fc_url = udpout://192.168.1.56:14283
pod_model = zhongke_d80
pod_video_url = rtsp://192.168.1.56:8569/zhongke_d80_4
pod_control_url = udp://192.168.1.56:8883
