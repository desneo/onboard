# SITL 捷联 A2416A机群部署预置
# pod_model 对应 Gazebo 资产目录 jielian-A2416A。
# 节名为飞机 ID；启动时按板卡的本机 IPv4 地址匹配 board_ip。
# fc_url 接受 MAVSDK 的 UDP 或串口地址，例如 serial:///dev/ttyS0:57600。

[uav1]
board_ip = 192.168.1.100
fc_url = udpout://192.168.1.56:14280
pod_model = jielian_a2416a
pod_video_url = rtsp://192.168.1.56:8554/jielian_a2416a
pod_control_url = udp://192.168.1.56:8001

