# 真机测试集群配置文件
# fc_url 接受 MAVSDK 的 UDP 或串口地址，例如 serial:///dev/ttyS7:115200 (使用firefly 3588板子，板子上通过排针引出ttl串口连接到飞控)

[uav1]
board_ip = 192.168.1.100
fc_url = serial:///dev/ttyS7:115200
pod_model = aisheng_asd2
pod_video_url = rtsp://192.168.1.56:8554/aisheng_seeker
pod_control_url = udp://192.168.1.56:8001

