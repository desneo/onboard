# SITL 通用两轴吊舱机群部署预置
# pod_model 对应 Gazebo 资产目录 two_axis_pod。
# 节名为飞机 ID；启动时按板卡的本机 IPv4 地址匹配 board_ip。
# fc_url 接受 MAVSDK 的 UDP 或串口地址，例如 serial:///dev/ttyS0:57600。

[uav1]
board_ip = 192.168.1.100
fc_url = udpout://192.168.1.56:14280
pod_model = two_axis
pod_video_url = rtsp://192.168.1.56:8555/two_axis_pod_1
pod_control_url = udp://192.168.1.56:8770

[uav2]
board_ip = 192.168.1.101
fc_url = udpout://192.168.1.56:14281
pod_model = two_axis
pod_video_url = rtsp://192.168.1.56:8555/two_axis_pod_2
pod_control_url = udp://192.168.1.56:8771

[uav3]
board_ip = 192.168.1.102
fc_url = udpout://192.168.1.56:14282
pod_model = two_axis
pod_video_url = rtsp://192.168.1.56:8555/two_axis_pod_3
pod_control_url = udp://192.168.1.56:8772

[uav4]
