# 测试配置：RTSP 取图 + WebRTC 推流
[system]
log_dir = logs

[plugins]
directory = plugins

[image_input]
type = Rtsp
mipi_device =
rtsp_url = rtsp://192.168.1.220:8554/drone
reconnect_interval_s = 10

[detection]
model_path = /home/firefly/code/projects/anti-uav/algorithm/models/yolo11/yolo11n
config_dir = /home/firefly/code/projects/anti-uav/algorithm/perception/configs
